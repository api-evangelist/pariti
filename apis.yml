name: Pariti
description: Pariti is an AI-powered talent acquisition platform that helps companies source, vet,
  and hire candidates through a community-driven referral network of thousands of leaders, technologists,
  and recruiters. It pairs recruiter-trained AI/ML candidate screening with salary benchmarking (Salary
  Insights) and a Talent Engine that aims to move roles from open to offer in about four weeks. Pariti
  is a portfolio company of 500 Global. No public developer API, OpenAPI specification, MCP server, or
  developer documentation surface was found during enrichment; this profile captures the company's
  public web presence and security posture as a lead awaiting a real API surface.
